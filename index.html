<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e89b4a" />
    <title>语语五子棋</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header>
        <div>
          <p class="eyebrow">边下边学，慢慢变厉害</p>
          <h1>语语专用五子棋</h1>
        </div>
        <button id="new-game-top" class="text-button" type="button">重新开始</button>
      </header>

      <section class="intro">
        <span class="tag">人机学习对弈</span>
        <h2>先连成五子，也要学会看住对方</h2>
        <p>语语执黑先走。每次电脑落子后，右边都会告诉你它为什么这么下，并提示你下一步可以想哪里。</p>
      </section>

      <section class="controls" aria-label="对局设置">
        <label>难度
          <select id="difficulty">
            <option value="easy">简单 · 陪练讲解</option>
            <option value="hard" selected>困难 · 认真对弈</option>
          </select>
        </label>
        <button id="new-game" class="primary-button" type="button">开新一局</button>
      </section>

      <section class="game-layout">
        <div class="board-column">
          <div class="turn-card" id="turn-card" aria-live="polite">轮到语语（黑棋）先走</div>
          <div class="board-coordinate-shell">
            <div id="column-labels" class="coordinate-labels columns" aria-hidden="true"></div>
            <div id="row-labels" class="coordinate-labels rows" aria-hidden="true"></div>
            <div id="board" class="board" role="grid" aria-label="15路五子棋棋盘"></div>
          </div>
        </div>

        <aside class="coach-card" aria-live="polite">
          <div class="coach-title"><span>🌱</span><h3>五子棋小老师</h3></div>
          <p id="coach-main">开局先靠近中心落子：那里能向横、竖、两条斜线同时发展。</p>
          <div class="coach-rule"><strong>这步怎么看</strong><p id="coach-reason">下棋前先看：自己有没有能连成五的点；再看对方有没有四连、活三需要马上挡住。</p></div>
          <div class="next-tip"><strong>下一步建议</strong><p id="next-tip">第一手试试棋盘中央的 H8。</p></div>
          <p class="coord-note">棋盘边上的字母和数字能帮你找到提示的交叉点。</p>
        </aside>
      </section>

      <p id="message" class="message" aria-live="assertive">点击一个交叉点，让语语先下黑棋。</p>
      <p class="source-note">本地五子棋 AI：棋型识别、威胁判断与 Alpha-Beta 搜索；无需联网。</p>
    </main>
    <script src="gomoku.js"></script>
  </body>
</html>
